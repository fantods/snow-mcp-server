[project]
name = "snow-mcp"
version = "0.1.0"
description = "Snow MCP Server - Persistent memory for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.26.0",
    "pydantic>=2.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
snow = "snow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
